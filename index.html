<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic page setup -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pizza Ordering Form</title>

  <!-- Styling for the page to make it look like the example -->
  <style>
    body {
      font-family: "Times New Roman", Times, serif;
      background: white;
      color: black;
    }

    .page {
      width: 520px;
      margin: 18px auto;
      border: 2px solid black;
      padding: 18px;
    }

    header h1 {
      font-size: 46px;
      margin-bottom: 18px;
    }

    section h2 {
      font-size: 38px;
      margin-top: 18px;
      margin-bottom: 10px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 6px 0;
    }

    .row label {
      width: 90px;
      font-size: 22px;
    }

    .row input {
      width: 330px;
      height: 28px;
      font-size: 18px;
    }

    select {
      height: 32px;
      font-size: 18px;
    }

    .radio-group,
    .toppings-grid {
      font-size: 24px;
      margin-top: 8px;
    }

    .toppings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 24px;
      width: 360px;
    }

    textarea {
      width: 360px;
      height: 55px;
      font-size: 18px;
    }

    button {
      font-size: 20px;
      margin-top: 6px;
    }

    table {
      border-collapse: collapse;
      width: 390px;
      font-size: 22px;
    }

    th, td {
      border: 2px solid black;
      padding: 4px 8px;
    }
  </style>
</head>

<body>
  <div class="page">

    <!-- Page title -->
    <header>
      <h1>Pizza Ordering Form</h1>
    </header>

    <main>
      <form action="#" method="post">

        <!-- Section for user contact info -->
        <section>
          <h2>Contact Information</h2>

          <!-- Name input -->
          <div class="row">
            <label for="name">Name:</label>
            <input type="text" id="name" required>
          </div>

          <!-- Phone input -->
          <div class="row">
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" required>
          </div>

          <!-- Email input -->
          <div class="row">
            <label for="email">Email:</label>
            <input type="email" id="email" required>
          </div>
        </section>

        <!-- Section to choose pizza size -->
        <section>
          <h2>Select Pizza Size</h2>

          <label for="size">Pizza Size:</label>
          <select id="size" required>
            <!-- Default option -->
            <option value="">--Select Size--</option>
            <option>Medium</option>
            <option>Large</option>
            <option>XLarge</option>
          </select>
        </section>

        <!-- Section to choose sauce -->
        <section>
          <h2>Select Sauce</h2>

          <!-- Radio buttons so only one sauce can be picked -->
          <div class="radio-group">
            <div>
              <input type="radio" name="sauce" id="marinara" required>
              <label for="marinara">Marinara</label>
            </div>

            <div>
              <input type="radio" name="sauce" id="ranch">
              <label for="ranch">Ranch</label>
            </div>

            <div>
              <input type="radio" name="sauce" id="nosauce">
              <label for="nosauce">No Sauce</label>
            </div>
          </div>
        </section>

        <!-- Section for choosing toppings -->
        <section>
          <h2>Select Toppings</h2>

          <!-- Checkboxes so multiple toppings can be chosen -->
          <div class="toppings-grid">
            <label><input type="checkbox"> Pepperoni</label>
            <label><input type="checkbox"> Sausage</label>
            <label><input type="checkbox"> Mushroom</label>
            <label><input type="checkbox"> Pineapple</label>
            <label><input type="checkbox"> Peppers</label>
            <label><input type="checkbox"> Onions</label>
          </div>
        </section>

        <!-- Extra instructions box -->
        <section>
          <h2>Additional Instructions</h2>
          <textarea placeholder="Add instructions"></textarea><br>
          <button type="submit">Submit</button>
        </section>

      </form>

      <!-- Favorite games table -->
      <section>
        <h3>List of My Favorite Games</h3>

        <!-- Table showing games with merged cells -->
        <table border="1">

          <!-- Table headers -->
          <thead>
            <tr>
              <th>Developer</th>
              <th>Title</th>
              <th>Year</th>
            </tr>
          </thead>

          <!-- Main table content -->
          <tbody>
            <!-- Insomniac Games covers 3 rows -->
            <tr>
              <td rowspan="3">Insomniac Games</td>
              <td>Spider-Man</td>
              <td>2018</td>
            </tr>
            <tr>
              <td>Miles Morales</td>
              <td>2020</td>
            </tr>
            <tr>
              <td>Spider-Man 2</td>
              <td>2023</td>
            </tr>

            <tr>
              <td>Visual Concepts</td>
              <td>NBA 2K16</td>
              <td>2015</td>
            </tr>
          </tbody>

          <!-- Bottom row that spans all columns -->
          <tfoot>
            <tr>
              <td colspan="3">Count: 4</td>
            </tr>
          </tfoot>

        </table>
      </section>

    </main>
  </div>
</body>
</html>
